<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">5.3 · Comunicación serial y delimitación de tramas</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Puerto, velocidad y formato</text><text x="44" y="166" fill="#403F3B" font-size="22">El puerto entrega bytes sin fronteras de mensaje.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Contrato del protocolo v1</text><text x="44" y="281" fill="#403F3B" font-size="22">LF delimita cada trama.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Fragmentación, acumulación y límites</text><text x="44" y="396" fill="#403F3B" font-size="22">El buffer tiene una longitud máxima.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Comandos y confirmaciones</text><text x="44" y="511" fill="#403F3B" font-size="22">ACK confirma el estado aplicado.</text></g></svg>
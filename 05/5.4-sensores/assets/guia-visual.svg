<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">5.4 · Sensores, muestreo y calibración</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Señal, resolución y referencia</text><text x="44" y="166" fill="#403F3B" font-size="22">Resolución y exactitud son diferentes.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Calibración de dos puntos</text><text x="44" y="281" fill="#403F3B" font-size="22">La calibración necesita referencias medidas.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Filtrado y latencia</text><text x="44" y="396" fill="#403F3B" font-size="22">La media móvil agrega latencia.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Tiempo, secuencia y ESP32</text><text x="44" y="511" fill="#403F3B" font-size="22">Raw y datos convertidos deben conservarse separados.</text></g></svg>
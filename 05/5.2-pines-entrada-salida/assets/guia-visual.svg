<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">5.2 · Pines de entrada y salida</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Entradas y pull-up</text><text x="44" y="166" fill="#403F3B" font-size="22">INPUT_PULLUP produce una entrada activa en bajo.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Rebote y detección de flanco</text><text x="44" y="281" fill="#403F3B" font-size="22">El rebote puede generar múltiples transiciones.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Salida digital y PWM</text><text x="44" y="396" fill="#403F3B" font-size="22">PWM regula el ciclo de trabajo de una señal digital.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Entrada física y estado de aplicación</text><text x="44" y="511" fill="#403F3B" font-size="22">La acción se asocia al flanco estable.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">5.5 · Integración de Java, Arduino y persistencia</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Arquitectura de la integración</text><text x="44" y="166" fill="#403F3B" font-size="22">Cada etapa tiene una responsabilidad.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Identidad, duplicados y reinicios</text><text x="44" y="281" fill="#403F3B" font-size="22">La sesión diferencia reinicios y duplicados.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Errores por etapa y cierre ordenado</text><text x="44" y="396" fill="#403F3B" font-size="22">Recibida y confirmada son estados distintos.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Simulación y verificación física</text><text x="44" y="511" fill="#403F3B" font-size="22">La simulación y el hardware requieren evidencias diferentes.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">5.1 · Fundamentos de Arduino</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">IDE, placa y estructura del sketch</text><text x="44" y="166" fill="#403F3B" font-size="22">El sketch ejecuta setup y loop.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Tipos, variables y operadores</text><text x="44" y="281" fill="#403F3B" font-size="22">Los tamaños de tipos dependen de la placa.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Funciones y ciclo no bloqueante</text><text x="44" y="396" fill="#403F3B" font-size="22">millis permite planificar sin bloquear.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Pines y límites eléctricos</text><text x="44" y="511" fill="#403F3B" font-size="22">Los pines tienen límites de tensión y corriente.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">2.2 · Diseño de expresiones regulares</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Clases, cuantificadores y agrupación</text><text x="44" y="166" fill="#403F3B" font-size="22">Los grupos con nombre identifican campos.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Dos niveles de escape</text><text x="44" y="281" fill="#403F3B" font-size="22">El literal Java y el patrón tienen escapes distintos.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Pattern, Matcher y flags</text><text x="44" y="396" fill="#403F3B" font-size="22">Pattern se reutiliza; Matcher conserva el estado de búsqueda.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Conversión y errores del dominio</text><text x="44" y="511" fill="#403F3B" font-size="22">La conversión numérica requiere validación posterior.</text></g></svg>
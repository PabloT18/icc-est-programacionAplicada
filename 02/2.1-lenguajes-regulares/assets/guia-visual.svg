<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">2.1 · Fundamentos de lenguajes regulares</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Alfabeto, cadena y lenguaje</text><text x="44" y="166" fill="#403F3B" font-size="22">Un lenguaje es un conjunto de cadenas.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Operaciones regulares y autómatas</text><text x="44" y="281" fill="#403F3B" font-size="22">Un autómata finito resume el prefijo en un estado.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Expresiones formales y motor de Java</text><text x="44" y="396" fill="#403F3B" font-size="22">El motor Java incluye extensiones al formalismo regular.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Validación completa y pruebas negativas</text><text x="44" y="511" fill="#403F3B" font-size="22">matches comprueba toda la entrada; el dominio valida su sentido.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">2.4 · Preprocesamiento y extracción de ficheros</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Lectura incremental y codificación</text><text x="44" y="166" fill="#403F3B" font-size="22">La lectura por flujo evita cargar todo el archivo.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Reconocimiento, conversión y modelo</text><text x="44" y="281" fill="#403F3B" font-size="22">Reconocer el formato no garantiza un valor válido.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Resumen y trazabilidad</text><text x="44" y="396" fill="#403F3B" font-size="22">Cada rechazo conserva su número de línea y motivo.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Rendimiento y límites</text><text x="44" y="511" fill="#403F3B" font-size="22">El tamaño de entrada y el costo del patrón necesitan límites.</text></g></svg>
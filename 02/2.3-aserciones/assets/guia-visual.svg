<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">2.3 · Aserciones y límites de coincidencia</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Aserciones de longitud cero</text><text x="44" y="166" fill="#403F3B" font-size="22">Las aserciones no consumen caracteres.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Anclas y límites de palabra</text><text x="44" y="281" fill="#403F3B" font-size="22">Las anclas y los límites restringen dónde coincide el patrón.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Composición sin ambigüedad</text><text x="44" y="396" fill="#403F3B" font-size="22">Lookahead y lookbehind comprueban el contexto de coincidencia.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Pruebas del contexto</text><text x="44" y="511" fill="#403F3B" font-size="22">Las pruebas deben variar el entorno de la coincidencia.</text></g></svg>
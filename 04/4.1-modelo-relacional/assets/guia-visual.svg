<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">4.1 · Modelo relacional y SQL</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Relaciones, filas y claves</text><text x="44" y="166" fill="#403F3B" font-size="22">Las claves identifican filas y relacionan las tablas.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Tipos y restricciones del dominio</text><text x="44" y="281" fill="#403F3B" font-size="22">Las restricciones complementan la validación en Java.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Operaciones SQL y consultas relacionadas</text><text x="44" y="396" fill="#403F3B" font-size="22">JOIN relaciona datos; ORDER BY define el orden.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Esquema reproducible y entorno</text><text x="44" y="511" fill="#403F3B" font-size="22">Un esquema versionado permite reconstruir el entorno.</text></g></svg>
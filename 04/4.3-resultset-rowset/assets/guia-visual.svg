<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">4.3 · ResultSet, RowSet y consultas parametrizadas</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Cursor y lectura de columnas</text><text x="44" y="166" fill="#403F3B" font-size="22">ResultSet se recorre con next.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">PreparedStatement y parámetros</text><text x="44" y="281" fill="#403F3B" font-size="22">PreparedStatement parametriza valores.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">RowSet conectado y desconectado</text><text x="44" y="396" fill="#403F3B" font-size="22">CachedRowSet permite lectura desconectada.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Límite, orden y paginación</text><text x="44" y="511" fill="#403F3B" font-size="22">La paginación necesita un orden estable.</text></g></svg>
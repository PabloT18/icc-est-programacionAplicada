<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">4.4 · Persistencia JDBC y transacciones</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Transacción y atomicidad del lote</text><text x="44" y="166" fill="#403F3B" font-size="22">La transacción define una unidad de confirmación.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Rollback, errores y estado de la conexión</text><text x="44" y="281" fill="#403F3B" font-size="22">rollback revierte los cambios pendientes.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Batch y validación</text><text x="44" y="396" fill="#403F3B" font-size="22">Batch agrupa operaciones; la transacción conserva la atomicidad.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Repository JDBC y pruebas de integración</text><text x="44" y="511" fill="#403F3B" font-size="22">El servicio coordina la conexión de los repositorios.</text></g></svg>
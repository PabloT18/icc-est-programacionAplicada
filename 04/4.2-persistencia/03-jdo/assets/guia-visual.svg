<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">4.2c · Java Data Objects</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Estándar JDO y proveedor</text><text x="44" y="166" fill="#403F3B" font-size="22">JDO necesita una implementación de persistencia.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Metadatos, identidad y enhancement</text><text x="44" y="281" fill="#403F3B" font-size="22">Los metadatos y el enhancer preparan el modelo persistente.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Transacciones y ciclo de vida</text><text x="44" y="396" fill="#403F3B" font-size="22">Las transacciones siguen siendo explícitas.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Comparación de responsabilidades</text><text x="44" y="511" fill="#403F3B" font-size="22">JDO gestiona objetos; JDBC expone operaciones SQL.</text></g></svg>
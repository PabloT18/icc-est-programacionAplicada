<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">4.2a · JDBC, Gradle y configuración YAML</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">API JDBC y controlador</text><text x="44" y="166" fill="#403F3B" font-size="22">JDBC es la API; el driver se comunica con el motor.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Conexiones y cierre de recursos</text><text x="44" y="281" fill="#403F3B" font-size="22">try-with-resources cierra los recursos incluso ante errores.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Gradle Kotlin DSL y versiones fijas</text><text x="44" y="396" fill="#403F3B" font-size="22">Gradle administra el classpath y fija las dependencias.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">application.yaml y variables de entorno</text><text x="44" y="511" fill="#403F3B" font-size="22">Java SE necesita código explícito para cargar YAML.</text></g></svg>
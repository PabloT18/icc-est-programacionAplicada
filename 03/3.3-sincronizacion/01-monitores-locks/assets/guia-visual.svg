<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">3.3a · Sincronización con monitores y locks</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Sección crítica e invariante</text><text x="44" y="166" fill="#403F3B" font-size="22">La sección crítica protege una invariante.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Métodos y bloques synchronized</text><text x="44" y="281" fill="#403F3B" font-size="22">synchronized usa un monitor concreto.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">ReentrantLock y liberación garantizada</text><text x="44" y="396" fill="#403F3B" font-size="22">unlock debe ejecutarse en finally.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Deadlock y orden de adquisición</text><text x="44" y="511" fill="#403F3B" font-size="22">Un orden de locks ayuda a prevenir deadlocks.</text></g></svg>
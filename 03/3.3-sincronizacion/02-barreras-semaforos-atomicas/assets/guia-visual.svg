<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">3.3b · Barreras, semáforos y variables atómicas</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Semáforo y capacidad</text><text x="44" y="166" fill="#403F3B" font-size="22">Semaphore limita la capacidad concurrente.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Barrera reutilizable y señal de finalización</text><text x="44" y="281" fill="#403F3B" font-size="22">CyclicBarrier coordina fases; CountDownLatch señala finalización.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Variables atómicas y operaciones compuestas</text><text x="44" y="396" fill="#403F3B" font-size="22">AtomicInteger no crea transacciones entre campos.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Coordinación combinada</text><text x="44" y="511" fill="#403F3B" font-size="22">Cada mecanismo protege una condición concreta del sistema.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">3.1 · Fundamentos de concurrencia</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Concurrencia y paralelismo</text><text x="44" y="166" fill="#403F3B" font-size="22">Concurrencia y paralelismo son conceptos distintos.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Estado compartido y condición de carrera</text><text x="44" y="281" fill="#403F3B" font-size="22">Una carrera puede perder actualizaciones.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Atomicidad, visibilidad y orden</text><text x="44" y="396" fill="#403F3B" font-size="22">Visibilidad no implica atomicidad.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Diseño con menos estado compartido</text><text x="44" y="511" fill="#403F3B" font-size="22">Las invariantes son mejores que el orden de println.</text></g></svg>
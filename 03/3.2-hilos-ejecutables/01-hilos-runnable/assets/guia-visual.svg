<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">3.2a · Hilos, Runnable, estados e interrupción</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Runnable y ciclo de vida</text><text x="44" y="166" fill="#403F3B" font-size="22">Runnable describe la tarea; start inicia otro hilo.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Unión con join</text><text x="44" y="281" fill="#403F3B" font-size="22">join espera la terminación y hace visibles sus resultados.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Interrupción cooperativa</text><text x="44" y="396" fill="#403F3B" font-size="22">interrupt solicita una cancelación cooperativa.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Coordinación sin esperar por azar</text><text x="44" y="511" fill="#403F3B" font-size="22">Una señal explícita coordina mejor que un sleep arbitrario.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">3.2b · Procesos y ejecutables Unix</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Proceso, hilo y ejecutable</text><text x="44" y="166" fill="#403F3B" font-size="22">Un proceso tiene recursos del sistema operativo.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Argumentos y ausencia de shell implícito</text><text x="44" y="281" fill="#403F3B" font-size="22">ProcessBuilder recibe argumentos separados.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Salida, errores y cierre</text><text x="44" y="396" fill="#403F3B" font-size="22">Las salidas sin consumir pueden bloquear.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Plazos y portabilidad</text><text x="44" y="511" fill="#403F3B" font-size="22">Un timeout requiere una política de terminación.</text></g></svg>
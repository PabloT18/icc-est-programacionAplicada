<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">3.6 · Concurrencia e interfaz gráfica con Swing</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Event Dispatch Thread</text><text x="44" y="166" fill="#403F3B" font-size="22">Swing actualiza sus componentes en el EDT.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">SwingWorker y comunicación</text><text x="44" y="281" fill="#403F3B" font-size="22">SwingWorker comunica el avance y el resultado al EDT.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Estado de pantalla y cancelación</text><text x="44" y="396" fill="#403F3B" font-size="22">Cancelar debe restaurar el estado de la vista.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Separación MVC</text><text x="44" y="511" fill="#403F3B" font-size="22">MVC separa datos, presentación y coordinación.</text></g></svg>
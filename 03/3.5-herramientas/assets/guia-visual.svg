<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">3.5 · Ejecutores, futuros e hilos virtuales</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">ExecutorService, Runnable y Callable</text><text x="44" y="166" fill="#403F3B" font-size="22">ExecutorService separa la tarea de su ejecución.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Future, timeout y cancelación</text><text x="44" y="281" fill="#403F3B" font-size="22">Future representa un resultado; el timeout no lo cancela.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Hilos virtuales y límites externos</text><text x="44" y="396" fill="#403F3B" font-size="22">Los hilos virtuales favorecen cargas de espera.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">CompletableFuture y composición</text><text x="44" y="511" fill="#403F3B" font-size="22">CompletableFuture permite componer resultados dependientes.</text></g></svg>
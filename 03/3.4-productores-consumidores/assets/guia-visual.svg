<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">3.4 · Productores y consumidores</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Cola acotada y contrapresión</text><text x="44" y="166" fill="#403F3B" font-size="22">Una cola acotada limita la acumulación.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">wait y notify como fundamento</text><text x="44" y="281" fill="#403F3B" font-size="22">wait libera el monitor y debe comprobarse dentro de un while.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Señal de terminación y número de consumidores</text><text x="44" y="396" fill="#403F3B" font-size="22">Se requiere una señal de fin por consumidor.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Orden y consistencia de resultados</text><text x="44" y="511" fill="#403F3B" font-size="22">FIFO no garantiza el orden de finalización.</text></g></svg>
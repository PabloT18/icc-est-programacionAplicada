<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">1.4 · Patrones con programación genérica</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Repository y contrato de identidad</text><text x="44" y="166" fill="#403F3B" font-size="22">Repository separa acceso y almacenamiento.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Strategy con interfaces funcionales</text><text x="44" y="281" fill="#403F3B" font-size="22">Strategy cambia un criterio sin duplicar el algoritmo.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Factory y dependencias explícitas</text><text x="44" y="396" fill="#403F3B" font-size="22">Factory centraliza la creación.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Evolución hacia persistencia</text><text x="44" y="511" fill="#403F3B" font-size="22">Los patrones responden a variaciones concretas.</text></g></svg>
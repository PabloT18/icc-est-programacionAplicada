<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">1.1a · Tipos y parámetros genéricos</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">El problema de Object y del casting</text><text x="44" y="166" fill="#403F3B" font-size="22">Los genéricos evitan conversiones inseguras al recuperar datos.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Parámetro de tipo y argumento de tipo</text><text x="44" y="281" fill="#403F3B" font-size="22">El parámetro declara el contrato; el argumento concreta el tipo.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Tipos de referencia y restricciones</text><text x="44" y="396" fill="#403F3B" font-size="22">Los argumentos genéricos deben ser tipos de referencia.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Contrato del contenedor e inmutabilidad</text><text x="44" y="511" fill="#403F3B" font-size="22">final protege la referencia; el dominio todavía exige validación.</text></g></svg>
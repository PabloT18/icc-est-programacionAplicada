<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">1.1b · Métodos genéricos y cotas</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Declaración y alcance del parámetro</text><text x="44" y="166" fill="#403F3B" font-size="22">&lt;T&gt; se declara antes del retorno.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Cotas para exigir operaciones</text><text x="44" y="281" fill="#403F3B" font-size="22">Las cotas expresan las operaciones necesarias.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Vacío, nulos y decisiones del algoritmo</text><text x="44" y="396" fill="#403F3B" font-size="22">Optional representa un resultado ausente.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Método reutilizable y regla del dominio</text><text x="44" y="511" fill="#403F3B" font-size="22">Comparator separa el criterio del recorrido.</text></g></svg>
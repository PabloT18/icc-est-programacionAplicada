<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">1.1c · Boxing, foreach, var y varargs</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Boxing y unboxing</text><text x="44" y="166" fill="#403F3B" font-size="22">Unboxing de null falla; equals compara valores.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">foreach y modificación de colecciones</text><text x="44" y="281" fill="#403F3B" font-size="22">foreach recorre elementos sin exponer el índice.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">var, args y varargs</text><text x="44" y="396" fill="#403F3B" font-size="22">var infiere un tipo local; args y varargs cumplen roles distintos.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Varargs genéricos y heap pollution</text><text x="44" y="511" fill="#403F3B" font-size="22">Un arreglo varargs genérico exige evitar heap pollution.</text></g></svg>
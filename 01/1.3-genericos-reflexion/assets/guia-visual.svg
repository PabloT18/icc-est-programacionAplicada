<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="580" viewBox="0 0 1160 580"><rect width="1160" height="580" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="24" y="48" font-size="26" font-weight="700" fill="#003772">1.3 · Genéricos y reflexión</text><rect x="24" y="90" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="124" fill="#003772" font-size="23" font-weight="700">Borrado y metadatos disponibles</text><text x="44" y="166" fill="#403F3B" font-size="22">El borrado elimina argumentos; las firmas conservan metadatos.</text><rect x="24" y="205" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="239" fill="#003772" font-size="23" font-weight="700">Class&lt;T&gt; como token de tipo</text><text x="44" y="281" fill="#403F3B" font-size="22">Class&lt;T&gt; permite conversiones comprobadas.</text><rect x="24" y="320" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="354" fill="#003772" font-size="23" font-weight="700">Anotaciones y descubrimiento controlado</text><text x="44" y="396" fill="#403F3B" font-size="22">Las anotaciones describen información accesible por reflexión.</text><rect x="24" y="435" width="1112" height="104" rx="10" fill="#F3F3FA"/><text x="44" y="469" fill="#003772" font-size="23" font-weight="700">Costo y alternativa explícita</text><text x="44" y="511" fill="#403F3B" font-size="22">La reflexión debe respetar contratos y acceso.</text></g></svg>